# ============================================================
# File: .github/ISSUE_TEMPLATE/question.yml
# Repo: https://github.com/Terriao/OpenDPC
# ============================================================

name: Question
description: Ask a question about how OpenDPC works or how to use it.
title: "[Q] "
labels: ["question"]
assignees:
  - Terriao

body:
  - type: markdown
    attributes:
      value: |
        For open-ended discussion please post in [Discussions](https://github.com/Terriao/OpenDPC/discussions).
        For specific technical questions, use this form.

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - "Player usage"
        - "JND sub-platform usage"
        - "PontZen preprocessing"
        - "V-PCC distortion-ladder configurations"
        - "Reproducing the 60-subject experiment"
        - "Building from source"
        - "Citation / publication"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Be as specific as possible. Include the relevant sequence / panel / config if any.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to achieve? What have you already tried?

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have read the README and the FAQ.
          required: true
        - label: I have searched existing issues for the same question.
          required: true
